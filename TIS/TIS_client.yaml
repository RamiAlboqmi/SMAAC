apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: tisclient
  namespace: default
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_OUTBOUND
        listener:
          filterChain:
            filter:
              name: 'envoy.filters.network.http_connection_manager'
              subFilter:
                name: 'envoy.filters.http.router'
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.lua
          typed_config:
            '@type': 'type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua'
            inlineCode: |

              function split_ (string_, bysep)
                local temp={}
                for str in string.gmatch(string_, "([^"..bysep.."]+)") do
                        table.insert(temp, str)
                end
                return temp
               end



              function envoy_on_request(request_handle)
                print("finding of processing time now")
                local start_time = os.clock()



                print("***************************************To Detect Unanunauthorized Access********NNNNNNNN************************************")
                local request_headers = request_handle:headers()
                for key, value in pairs(request_headers) do
                  print("key===", key)
                  print("value====", value)
                end
                local path = request_headers:get("x-envoy-downstream-service-node")
                local callerid = request_headers:get("x-envoy-peer-metadata-id")
                local calleridnew = request_headers:get("x-envoy-downstream-service-cluster")
                print("calleridnew", calleridnew)
                local path = request_handle:headers():get(":path")
                local x_envoy = request_headers:get("x-envoy-decorator-operation")
                print("x_envoy =", x_envoy)
                local target_ms = split_(x_envoy,"\\.")[1]
                print("target_ms =", target_ms)
                print("callerid =", callerid)

                --  local currentMS = split_(split_(callerid,"~")[3],"-")[1]
                local temCurrentMS = string.match(callerid, "sidecar~[^~]+~([%w%-]+)-")
                --  local currentMStemp = string.match(temCurrentMS, "^(.-.-.-)")
                local currentMS = string.match(temCurrentMS, "(.+)%-%w+$")
                --  print("currentMStemp", currentMStemp)
                print("currentMS:", currentMS)
                print("temCurrentMS", temCurrentMS)
                local values = currentMS  .."/" ..    target_ms
                print("target_ms:", target_ms)
                print("values:", values)
                print("*********************************************************************************** start in sidecar of:", currentMS)
                print("values:", values)
                local request_headers = request_handle:headers()
                local service_url = "rte.istio-system.svc.cluster.local"
                print("service URL:", service_url)
                local cluster_url = "outbound|8099||" .. service_url
                print("cluster_url:"  ,cluster_url)
                local request_headers_values = {
                 [":method"] = "GET",
                 [":path"] = "/IsItAnunauthorizedAccess/" .. tostring(values),
                 [":authority"] = service_url
                 }
                local timeout_value = 5000
                local response_headers_values, response_body_values = request_handle:httpCall(
                 cluster_url,
                 request_headers_values,
                 request_body,
                 timeout_value
                 )
                print("Response Headers:", tostring(response_headers_values[":status"]))
               for key, value in pairs(response_headers_values) do
                  print("response_headers key:", key)
                  print("response_headers value:", value)
                end
                local decision = tostring(response_body_values);
                print("Response", decision)
                if decision == "3" then
                  print("Can not till yet. There is is no baseline.")
                end
                if decision == "1" then
                  print("There is a match. No trust (TM) should be decreased.")
                end
                if decision == "0" then
                  print("The trust has to be decreased")
                  local request_headers_values_ = {
                   [":method"] = "GET",
                   [":path"] = "/DetermineNewTrustLevelforMaliciousMicroservice/" .. values ,
                   [":authority"] = service_url
                   }
                  local timeout_value_ = 1000
                  local response_headers_values, response_body_values_ = request_handle:httpCall(
                   cluster_url,
                   request_headers_values_,
                   request_body,
                   timeout_value
                 )
                  local trsut_value = tostring(response_body_values_);
                  print("New trsut value=", trsut_value)
                end
                print("***************************************To pull a STIX document for a microservcice ********************************************")

                local request_headers_tis = request_handle:headers()
                local service_url_tis = "stixservice.istio-system.svc.cluster.local"
                local cluster_url_tis = "outbound|9708||" .. service_url_tis
                local request_headers_values_tis = {
                 [":method"] = "GET",
                 [":path"] = "/hasValidRegistraion/" .. tostring(values),
                 [":authority"] = service_url_tis
                 }
                local request_headers_values_tis, response_body_values_tis = request_handle:httpCall(
                 cluster_url_tis,
                 request_headers_values_tis,
                 request_body,
                 timeout_value
                 )
                local decision_hasValidRegistraion = tostring(response_body_values_tis);
                local decision_hasValidRegistraion_result = split_(decision_hasValidRegistraion, "/")
                if decision_hasValidRegistraion_result == "1" then
                  print("Access to pull threat data is denied due the TM is lower than the imposed TM_acceptable")
                  print("Also, the malicious microservice has been removed from the trusted microservice list")

                end
                if decision_hasValidRegistraion_result == "2" then
                  print("Here is the shared STIX data:", decision_hasValidRegistraion_result[2] )
                end




                print("*********************************************************************************** end in sidecar of:", currentMS)

                local end_time = os.clock()
                local processing_time = (end_time - start_time) * 1000 -- Convert to milliseconds

                print(string.format("Processing Time (v2): %.3f ms", processing_time))

              end
